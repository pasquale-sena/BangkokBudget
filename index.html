<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangkok Monthly Budget</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Hide scrollbar for clean UI in lists if needed */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Custom animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-950 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-100 min-h-screen pb-24">

    <div id="app" class="max-w-3xl mx-auto p-3 md:p-8 space-y-6">
        <!-- Content will be injected here by JavaScript -->
    </div>

    <!-- Hidden File Input for Restore -->
    <input type="file" id="file-restore" class="hidden" accept=".json" onchange="window.app.handleImport(event)">

    <script>
        // --- CONSTANTS & CONFIGURATION ---

        const INITIAL_BUDGET = {
            rent: { label: 'Rent', target: 35000, icon: 'home', fixed: true, subCategories: [] },
            food: { 
                label: 'Food', 
                target: 9600, 
                icon: 'utensils', 
                subCategories: [
                    { id: 'water_delivery', label: 'Drinking Water', cost: 600 }
                ] 
            },
            cat: { 
                label: 'Cat Care', 
                target: 2450, 
                icon: 'cat',
                subCategories: [
                    { id: 'cat1', label: 'Dry Food (Royal Canin)', cost: 1350 },
                    { id: 'cat2', label: 'Wet Food (Pouches)', cost: 850 },
                    { id: 'cat3', label: 'Tofu Litter', cost: 250 }
                ]
            },
            massage: { label: 'Wellness', target: 5500, icon: 'heart', subCategories: [] },
            utilities: { label: 'Utilities', target: 3500, icon: 'zap', subCategories: [] },
            dates: { label: 'Date Nights', target: 5000, icon: 'heart', subCategories: [] },
            nightsOut: { label: 'Nights Out', target: 4000, icon: 'music', subCategories: [] },
            transport: { label: 'Transport', target: 1500, icon: 'bus', subCategories: [] },
            internet: { 
                label: 'Tech Bills', 
                target: 1200, 
                icon: 'wifi', 
                fixed: true,
                subCategories: [
                    { id: 'int1', label: 'Fiber Internet', cost: 500 },
                    { id: 'int2', label: '5G Mobile', cost: 400 },
                    { id: 'int3', label: 'Netflix', cost: 169 },
                    { id: 'int4', label: 'Spotify', cost: 139 }
                ]
            },
            health: { label: 'Health', target: 2500, icon: 'stethoscope', fixed: true, subCategories: [] },
        };

        const CATEGORY_KEYS = Object.keys(INITIAL_BUDGET);

        const DEFAULT_RATES = {
            THB: 1,
            USD: 0.029,
            EUR: 0.027
        };

        // --- STATE MANAGEMENT ---

        const state = {
            currentDate: new Date(),
            budgetConfig: INITIAL_BUDGET,
            isEditingTargets: false,
            showDataMenu: false,
            currency: 'THB',
            exchangeRates: DEFAULT_RATES,
            lastRefreshed: null,
            expandedHistory: null,
            expandedChecklist: null,
            newItemLabel: '',
            newItemCost: '',
            financialData: {},
            checklistData: {},
            variableCosts: {}
        };

        // --- LOCAL STORAGE HELPERS ---

        function loadFromStorage() {
            try {
                // Config
                const savedConfig = localStorage.getItem('bangkok_budget_config');
                if (savedConfig) {
                    const parsed = JSON.parse(savedConfig);
                    state.budgetConfig = { ...INITIAL_BUDGET, ...parsed };
                }

                // Currency
                const savedCurrency = localStorage.getItem('bangkok_budget_currency');
                if (savedCurrency) state.currency = savedCurrency;

                // Data
                const savedData = localStorage.getItem('bangkok_budget_data');
                state.financialData = savedData ? JSON.parse(savedData) : {};

                const savedChecklists = localStorage.getItem('bangkok_budget_checklists');
                state.checklistData = savedChecklists ? JSON.parse(savedChecklists) : {};

                const savedVariable = localStorage.getItem('bangkok_budget_variable');
                state.variableCosts = savedVariable ? JSON.parse(savedVariable) : {};

            } catch (e) {
                console.error("Error loading storage", e);
            }
        }

        function saveToStorage() {
            localStorage.setItem('bangkok_budget_config', JSON.stringify(state.budgetConfig));
            localStorage.setItem('bangkok_budget_currency', state.currency);
            localStorage.setItem('bangkok_budget_data', JSON.stringify(state.financialData));
            localStorage.setItem('bangkok_budget_checklists', JSON.stringify(state.checklistData));
            localStorage.setItem('bangkok_budget_variable', JSON.stringify(state.variableCosts));
        }

        // --- CORE LOGIC & CALCULATIONS ---

        function getMonthKey(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
        }

        function getCurrencySymbol(curr) {
            switch(curr) {
                case 'USD': return '$';
                case 'EUR': return '€';
                default: return '฿';
            }
        }

        function formatMoney(amountInTHB) {
            const rate = state.exchangeRates[state.currency];
            const value = amountInTHB * rate;
            
            return new Intl.NumberFormat(state.currency === 'THB' ? 'th-TH' : 'en-US', { 
                style: 'currency', 
                currency: state.currency,
                maximumFractionDigits: state.currency === 'THB' ? 0 : 2
            }).format(value);
        }

        function getPacingPercent() {
            const now = new Date();
            const isCurrentMonth = now.getMonth() === state.currentDate.getMonth() && now.getFullYear() === state.currentDate.getFullYear();
            if (!isCurrentMonth) return null;
            const daysInMonth = new Date(state.currentDate.getFullYear(), state.currentDate.getMonth() + 1, 0).getDate();
            return (now.getDate() / daysInMonth) * 100;
        }

        function syncTotalCost(key, newVariableCost = null, newCheckedItems = null) {
            const currentKey = getMonthKey(state.currentDate);

            // 1. Get Variable Cost
            const currentVar = newVariableCost !== null 
                ? newVariableCost 
                : (state.variableCosts[currentKey]?.[key] || 0);

            // 2. Get Checklist Cost
            const checked = newCheckedItems !== null 
                ? newCheckedItems 
                : (state.checklistData[currentKey]?.[key] || []);
            
            const subCategories = state.budgetConfig[key].subCategories || [];
            let checklistTotal = 0;
            subCategories.forEach(sub => {
                if (checked.includes(sub.label)) {
                    checklistTotal += sub.cost;
                }
            });

            // 3. Update Financial Data
            const grandTotal = currentVar + checklistTotal;
            
            if (!state.financialData[currentKey]) state.financialData[currentKey] = {};
            state.financialData[currentKey][key] = grandTotal;

            saveToStorage();
            render();
        }

        function calculateCurrentMonthData() {
            const currentKey = getMonthKey(state.currentDate);
            const data = state.financialData[currentKey] || {};
            let totalTarget = 0;
            let totalActual = 0;

            const categories = CATEGORY_KEYS.map(key => {
                const config = state.budgetConfig[key];
                const actual = data[key] !== undefined ? data[key] : 0;
                
                totalTarget += config.target;
                totalActual += actual;

                const percent = config.target > 0 ? Math.min((actual / config.target) * 100, 100) : (actual > 0 ? 100 : 0);
                
                let statusColor = 'bg-gradient-to-r from-emerald-500 to-teal-400 shadow-[0_0_10px_rgba(16,185,129,0.5)]';
                if (percent > 100) statusColor = 'bg-gradient-to-r from-rose-500 to-red-600 shadow-[0_0_10px_rgba(244,63,94,0.5)]';
                else if (percent > 85) statusColor = 'bg-gradient-to-r from-amber-400 to-orange-500 shadow-[0_0_10px_rgba(251,191,36,0.5)]';

                return {
                    key,
                    ...config,
                    actual,
                    percent,
                    statusColor,
                    isOver: actual > config.target,
                    hasChecklist: config.subCategories && config.subCategories.length > 0
                };
            });

            // Trend
            const prevDate = new Date(state.currentDate);
            prevDate.setMonth(prevDate.getMonth() - 1);
            const prevKey = getMonthKey(prevDate);
            const prevData = state.financialData[prevKey];
            
            let trend = null;
            if (prevData) {
                const prevTotal = Object.values(prevData).reduce((a, b) => a + b, 0);
                if (prevTotal > 0) {
                    const diff = totalActual - prevTotal;
                    const percentDiff = (diff / prevTotal) * 100;
                    trend = { diff, percentDiff };
                }
            }

            return { categories, totalTarget, totalActual, remaining: totalTarget - totalActual, trend };
        }

        function getHistoryForCategory(categoryKey) {
            const history = [];
            for (let i = 5; i >= 0; i--) {
                const d = new Date(state.currentDate);
                d.setMonth(d.getMonth() - i);
                const k = getMonthKey(d);
                const val = state.financialData[k]?.[categoryKey] || 0;
                history.push({
                    month: d.toLocaleDateString('en-US', { month: 'short' }),
                    value: val,
                    isCurrent: i === 0
                });
            }
            return history;
        }

        // --- ACTIONS & HANDLERS ---

        const actions = {
            toggleCurrency: () => {
                const cycle = ['THB', 'USD', 'EUR'];
                const next = cycle[(cycle.indexOf(state.currency) + 1) % cycle.length];
                state.currency = next;
                saveToStorage();
                render();
            },
            prevMonth: () => {
                state.currentDate.setMonth(state.currentDate.getMonth() - 1);
                state.expandedHistory = null;
                state.expandedChecklist = null;
                render();
            },
            nextMonth: () => {
                state.currentDate.setMonth(state.currentDate.getMonth() + 1);
                state.expandedHistory = null;
                state.expandedChecklist = null;
                render();
            },
            handleMainInput: (key, valueStr) => {
                const numValue = parseInt(valueStr.replace(/[^0-9]/g, ''), 10) || 0;
                const currentKey = getMonthKey(state.currentDate);
                const config = state.budgetConfig[key];

                if (!config.subCategories || config.subCategories.length === 0) {
                    if (!state.financialData[currentKey]) state.financialData[currentKey] = {};
                    state.financialData[currentKey][key] = numValue;
                    
                    if (!state.variableCosts[currentKey]) state.variableCosts[currentKey] = {};
                    state.variableCosts[currentKey][key] = numValue;

                    saveToStorage();
                    render();
                }
            },
            handleVariableInput: (key, valueStr) => {
                const numValue = parseInt(valueStr.replace(/[^0-9]/g, ''), 10) || 0;
                const currentKey = getMonthKey(state.currentDate);

                if (!state.variableCosts[currentKey]) state.variableCosts[currentKey] = {};
                state.variableCosts[currentKey][key] = numValue;
                
                // Don't save yet, syncTotalCost handles save & render
                syncTotalCost(key, numValue, null);
            },
            handleQuickFill: (key, amount) => {
                actions.handleMainInput(key, amount.toString());
            },
            handleTargetChange: (key, valueStr) => {
                const numValue = parseInt(valueStr.replace(/[^0-9]/g, ''), 10) || 0;
                state.budgetConfig[key].target = numValue;
                saveToStorage(); // Config has changed
                render();
            },
            toggleExpandedChecklist: (key) => {
                state.expandedChecklist = state.expandedChecklist === key ? null : key;
                render();
            },
            toggleExpandedHistory: (key) => {
                state.expandedHistory = state.expandedHistory === key ? null : key;
                render();
            },
            addChecklistItem: (categoryKey) => {
                if (!state.newItemLabel || !state.newItemCost) return;
                const cost = parseInt(state.newItemCost, 10) || 0;
                const newItem = { id: Date.now().toString(), label: state.newItemLabel, cost };

                if (!state.budgetConfig[categoryKey].subCategories) state.budgetConfig[categoryKey].subCategories = [];
                state.budgetConfig[categoryKey].subCategories.push(newItem);

                state.newItemLabel = '';
                state.newItemCost = '';
                saveToStorage();
                render();
            },
            removeChecklistItem: (categoryKey, itemId, itemLabel) => {
                state.budgetConfig[categoryKey].subCategories = state.budgetConfig[categoryKey].subCategories.filter(item => item.id !== itemId);
                
                // Uncheck if checked
                const currentKey = getMonthKey(state.currentDate);
                const currentChecked = state.checklistData[currentKey]?.[categoryKey] || [];
                
                if (currentChecked.includes(itemLabel)) {
                    const newChecked = currentChecked.filter(label => label !== itemLabel);
                    if (!state.checklistData[currentKey]) state.checklistData[currentKey] = {};
                    state.checklistData[currentKey][categoryKey] = newChecked;
                    syncTotalCost(categoryKey, null, newChecked);
                } else {
                    saveToStorage();
                    render();
                }
            },
            toggleChecklistItem: (categoryKey, itemLabel) => {
                const currentKey = getMonthKey(state.currentDate);
                const currentChecked = state.checklistData[currentKey]?.[categoryKey] || [];
                const isChecked = currentChecked.includes(itemLabel);
                
                let newChecked;
                if (isChecked) {
                    newChecked = currentChecked.filter(i => i !== itemLabel);
                } else {
                    newChecked = [...currentChecked, itemLabel];
                }

                if (!state.checklistData[currentKey]) state.checklistData[currentKey] = {};
                state.checklistData[currentKey][categoryKey] = newChecked;
                
                syncTotalCost(categoryKey, null, newChecked);
            },
            setNewItemLabel: (val) => { state.newItemLabel = val; }, // re-render not needed usually, but good for react-sync feel if we wanted validation visual
            setNewItemCost: (val) => { state.newItemCost = val; },
            toggleEditingTargets: () => {
                state.isEditingTargets = !state.isEditingTargets;
                render();
            },
            resetTargets: () => {
                if (confirm('Reset all targets to original defaults?')) {
                    state.budgetConfig = JSON.parse(JSON.stringify(INITIAL_BUDGET)); // Deep copy
                    state.isEditingTargets = false;
                    saveToStorage();
                    render();
                }
            },
            toggleDataMenu: () => {
                state.showDataMenu = !state.showDataMenu;
                render();
            },
            handleExport: () => {
                const exportData = { 
                    config: state.budgetConfig, 
                    history: state.financialData, 
                    checklists: state.checklistData, 
                    variable: state.variableCosts 
                };
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", `bangkok_budget_backup_${new Date().toISOString().split('T')[0]}.json`);
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
                state.showDataMenu = false;
                render();
            },
            triggerImport: () => {
                document.getElementById('file-restore').click();
            },
            handleImport: (event) => {
                const fileReader = new FileReader();
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = e => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (parsed.config) state.budgetConfig = parsed.config;
                        if (parsed.history) state.financialData = parsed.history;
                        if (parsed.checklists) state.checklistData = parsed.checklists;
                        if (parsed.variable) state.variableCosts = parsed.variable;
                        saveToStorage();
                        alert("Data restored successfully!");
                    } catch (err) {
                        alert("Invalid file format");
                    }
                    state.showDataMenu = false;
                    render();
                };
            }
        };

        // Expose actions to window for HTML event handlers
        window.app = actions;

        // --- RENDER FUNCTIONS ---

        function renderHeader() {
            return `
                <header class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div class="flex items-center justify-between w-full md:w-auto">
                        <h1 class="text-xl md:text-2xl font-bold text-white tracking-tight flex items-center gap-3 drop-shadow-lg">
                            <div class="p-2 bg-blue-500/20 rounded-xl border border-blue-400/20 backdrop-blur-md">
                                <i data-lucide="wallet" class="w-6 h-6 text-blue-400"></i>
                            </div>
                            Bangkok Monthly Budget
                        </h1>
                        <button onclick="window.app.toggleCurrency()" class="md:hidden flex items-center gap-1.5 px-3 py-1.5 bg-white/5 border border-white/10 rounded-lg text-xs font-semibold text-blue-300 active:scale-95">
                            <i data-lucide="globe" class="w-3 h-3"></i>
                            ${state.currency}
                        </button>
                    </div>
                    
                    <div class="flex items-center gap-3 w-full md:w-auto">
                        <button onclick="window.app.toggleCurrency()" class="hidden md:flex items-center gap-2 px-3 py-2 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-xs font-semibold text-blue-300 transition-all active:scale-95" title="Refreshed: ${state.lastRefreshed ? state.lastRefreshed.toLocaleTimeString() : 'Just now'}">
                            <i data-lucide="globe" class="w-4 h-4"></i>
                            ${state.currency}
                        </button>

                        <div class="flex-1 flex items-center justify-between gap-2 bg-white/5 backdrop-blur-xl p-1.5 rounded-xl border border-white/10 shadow-xl">
                            <button onclick="window.app.prevMonth()" class="p-3 md:p-2 hover:bg-white/10 rounded-lg transition-all active:scale-95 text-slate-300 hover:text-white">
                                <i data-lucide="chevron-left" class="w-5 h-5"></i>
                            </button>
                            <span class="flex-1 md:w-32 text-center font-semibold text-slate-200 select-none tracking-wide text-sm">
                                ${state.currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}
                            </span>
                            <button onclick="window.app.nextMonth()" class="p-3 md:p-2 hover:bg-white/10 rounded-lg transition-all active:scale-95 text-slate-300 hover:text-white">
                                <i data-lucide="chevron-right" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                </header>
            `;
        }

        function renderSummary(data) {
            const diffPositive = data.trend && data.trend.diff > 0;
            const trendColor = diffPositive ? 'text-rose-400' : 'text-emerald-400';
            const remainingColor = data.remaining < 0 ? 'text-rose-400' : 'text-emerald-400';
            const remainingBg = data.remaining < 0 ? 'bg-rose-900/20 border-rose-500/30' : 'bg-emerald-900/20 border-emerald-500/30';
            const remainingLabel = data.remaining < 0 ? 'text-rose-300' : 'text-emerald-300';
            const actualColor = data.totalActual > data.totalTarget ? 'text-rose-400' : 'text-blue-400';

            return `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-white/5 backdrop-blur-xl p-5 rounded-2xl border transition-all duration-300 flex flex-row md:flex-col items-center justify-between md:justify-center group hover:bg-white/10 ${state.isEditingTargets ? 'border-blue-500/50 shadow-[0_0_20px_rgba(59,130,246,0.15)]' : 'border-white/10 shadow-lg'}">
                        <span class="text-slate-400 text-xs font-medium uppercase tracking-widest md:mb-2">Target Budget</span>
                        <div class="text-right md:text-center">
                            <span class="block text-xl md:text-3xl font-bold text-slate-100 drop-shadow-md">${formatMoney(data.totalTarget)}</span>
                            ${state.isEditingTargets ? '<span class="block text-[10px] text-blue-400 font-medium tracking-wider animate-pulse mt-1">EDITING</span>' : ''}
                        </div>
                    </div>
                    
                    <div class="bg-white/5 backdrop-blur-xl p-5 rounded-2xl border border-white/10 shadow-lg flex flex-row md:flex-col items-center justify-between md:justify-center group hover:bg-white/10 transition-colors relative overflow-hidden">
                        <span class="text-slate-400 text-xs font-medium uppercase tracking-widest md:mb-2">Actual Spent</span>
                        <div class="text-right md:text-center relative z-10">
                            <span class="block text-xl md:text-3xl font-bold drop-shadow-md transition-colors duration-500 ${actualColor}">
                                ${formatMoney(data.totalActual)}
                            </span>
                            ${data.trend ? `
                                <div class="flex items-center justify-end md:justify-center gap-1 mt-1 text-[10px] font-bold ${trendColor}">
                                    <i data-lucide="${diffPositive ? 'arrow-up-right' : 'arrow-down-right'}" class="w-3 h-3"></i>
                                    ${Math.abs(data.trend.percentDiff).toFixed(1)}% vs last month
                                </div>
                            ` : ''}
                        </div>
                    </div>

                    <div class="p-5 rounded-2xl border backdrop-blur-xl shadow-lg flex flex-row md:flex-col items-center justify-between md:justify-center transition-all duration-500 group hover:bg-opacity-20 ${remainingBg}">
                        <span class="text-xs font-medium uppercase tracking-widest md:mb-2 ${remainingLabel}">Remaining</span>
                        <span class="text-xl md:text-3xl font-bold drop-shadow-md ${remainingColor}">
                            ${formatMoney(data.remaining)}
                        </span>
                    </div>
                </div>
            `;
        }

        function renderCategoryList(data) {
            const pacingPercent = getPacingPercent();

            const categoriesHtml = data.categories.map(cat => {
                const isExpandedChecklist = state.expandedChecklist === cat.key;
                const isExpandedHistory = state.expandedHistory === cat.key;
                const currentKey = getMonthKey(state.currentDate);
                const variableValue = state.variableCosts[currentKey]?.[cat.key] || '';

                // Checklist HTML Generation
                let checklistHtml = '';
                if (isExpandedChecklist) {
                    const checklistItems = (cat.subCategories || []).map(item => {
                        const isChecked = state.checklistData[currentKey]?.[cat.key]?.includes(item.label);
                        return `
                            <div class="flex gap-2">
                                <button onclick="window.app.toggleChecklistItem('${cat.key}', '${item.label}')" class="flex-1 flex items-center justify-between p-3 rounded-lg border transition-all ${isChecked ? 'bg-blue-500/20 border-blue-500/30 text-white' : 'bg-black/20 border-white/5 text-slate-400 hover:bg-white/5'}">
                                    <div class="flex items-center gap-3">
                                        <div class="w-5 h-5 rounded border flex items-center justify-center transition-colors ${isChecked ? 'bg-blue-500 border-blue-500' : 'border-slate-600'}">
                                            ${isChecked ? '<i data-lucide="check" class="w-3.5 h-3.5 text-white"></i>' : ''}
                                        </div>
                                        <span class="text-sm font-medium">${item.label}</span>
                                    </div>
                                    <span class="text-xs font-semibold opacity-70">${formatMoney(item.cost)}</span>
                                </button>
                                <button onclick="window.app.removeChecklistItem('${cat.key}', '${item.id}', '${item.label}')" class="p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 hover:bg-red-500/20 hover:text-red-300 transition-colors" title="Delete item">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        `;
                    }).join('');

                    checklistHtml = `
                        <div class="px-4 pb-4 md:px-16 animate-fade-in">
                            <div class="bg-slate-900/50 rounded-xl border border-white/10 p-4 shadow-inner space-y-4">
                                <div class="flex justify-between items-center">
                                    <h4 class="text-sm font-medium text-blue-300 flex items-center gap-2">
                                        <i data-lucide="list-todo" class="w-4 h-4"></i> Manage Items
                                    </h4>
                                    <button onclick="window.app.toggleExpandedChecklist('${cat.key}')"><i data-lucide="x" class="w-4 h-4 text-slate-500 hover:text-white"></i></button>
                                </div>

                                <!-- Variable Input -->
                                <div class="bg-black/20 rounded-lg p-3 border border-white/5 flex items-center justify-between">
                                    <div class="flex items-center gap-2">
                                        <div class="p-1.5 bg-emerald-500/20 rounded-md text-emerald-400">
                                            <i data-lucide="coins" class="w-4 h-4"></i>
                                        </div>
                                        <div class="flex flex-col">
                                            <span class="text-sm font-medium text-slate-200">Variable / Cash</span>
                                            <span class="text-[10px] text-slate-500">Daily spending, meals, unlisted</span>
                                        </div>
                                    </div>
                                    <div class="relative w-32">
                                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs">THB</span>
                                        <input type="number" value="${variableValue}" onchange="window.app.handleVariableInput('${cat.key}', this.value)" placeholder="0" class="w-full bg-slate-800 border border-white/10 rounded-md py-1.5 pl-8 pr-2 text-right text-sm text-white focus:outline-none focus:border-emerald-500/50" />
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    ${checklistItems.length > 0 ? checklistItems : '<div class="col-span-full text-center py-2 text-slate-500 text-xs">No fixed items. Use "Variable / Cash" above or add items below.</div>'}
                                </div>

                                <div class="pt-3 border-t border-white/5">
                                    <div class="flex flex-col md:flex-row gap-3 items-end">
                                        <div class="flex-1 w-full">
                                            <label class="text-[10px] uppercase text-slate-500 font-bold tracking-wider mb-1 block">Item Name</label>
                                            <input type="text" oninput="window.app.setNewItemLabel(this.value)" placeholder="e.g. Monthly Sub" class="w-full bg-black/20 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500/50 focus:outline-none" />
                                        </div>
                                        <div class="w-full md:w-32">
                                            <label class="text-[10px] uppercase text-slate-500 font-bold tracking-wider mb-1 block">Cost (THB)</label>
                                            <input type="number" oninput="window.app.setNewItemCost(this.value)" placeholder="0" class="w-full bg-black/20 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500/50 focus:outline-none" />
                                        </div>
                                        <button onclick="window.app.addChecklistItem('${cat.key}')" class="w-full md:w-auto flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                            <i data-lucide="plus" class="w-4 h-4"></i> Add
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                // History HTML Generation
                let historyHtml = '';
                if (isExpandedHistory) {
                    const historyData = getHistoryForCategory(cat.key);
                    const maxVal = Math.max(cat.target * 1.2, ...historyData.map(d => d.value));
                    
                    const bars = historyData.map(d => {
                        const barHeight = (d.value / maxVal) * 100;
                        return `
                            <div class="flex-1 flex flex-col items-center gap-2 group/bar">
                                <div class="text-[10px] text-white opacity-0 group-hover/bar:opacity-100 transition-opacity absolute -mt-5 font-bold">
                                    ${formatMoney(d.value)}
                                </div>
                                <div class="w-full bg-slate-800/50 rounded-t-sm relative h-full flex items-end overflow-hidden">
                                    <div class="w-full transition-all duration-500 ${d.isCurrent ? 'bg-purple-500' : 'bg-slate-600 group-hover/bar:bg-slate-500'}" style="height: ${Math.max(barHeight, 2)}%"></div>
                                </div>
                                <span class="text-[10px] font-medium uppercase ${d.isCurrent ? 'text-purple-300' : 'text-slate-500'}">${d.month}</span>
                            </div>
                        `;
                    }).join('');

                    historyHtml = `
                        <div class="px-4 pb-4 md:px-16 animate-fade-in">
                            <div class="bg-slate-900/50 rounded-xl border border-white/10 p-4 shadow-inner">
                                <div class="flex justify-between items-center mb-4">
                                    <h4 class="text-sm font-medium text-purple-300 flex items-center gap-2">
                                        <i data-lucide="bar-chart-3" class="w-4 h-4"></i> 6-Month Trend
                                    </h4>
                                    <button onclick="window.app.toggleExpandedHistory('${cat.key}')"><i data-lucide="x" class="w-4 h-4 text-slate-500 hover:text-white"></i></button>
                                </div>
                                <div class="flex items-end justify-between h-32 gap-2 pt-4">
                                    ${bars}
                                </div>
                            </div>
                        </div>
                    `;
                }

                // Main Row HTML
                const displayActual = cat.actual > 0 ? (state.currency === 'THB' ? cat.actual : (cat.actual * state.exchangeRates[state.currency]).toFixed(2)) : '';
                const inputClass = cat.isOver 
                    ? 'border-rose-500/30 text-rose-400 focus:border-rose-500 placeholder-rose-900/50' 
                    : 'border-white/5 text-white focus:border-blue-500/50 placeholder-slate-700';

                return `
                    <div class="border-b border-white/5 last:border-0">
                        <div class="p-4 hover:bg-white/5 transition-colors group relative">
                            <div class="flex flex-wrap md:flex-nowrap items-center gap-x-4 gap-y-3">
                                
                                <div class="flex items-center gap-4 order-1 flex-1 min-w-0 md:w-72 md:flex-none">
                                    <div class="p-2.5 bg-slate-800/50 rounded-xl text-slate-400 group-hover:text-blue-400 group-hover:bg-blue-500/10 transition-all border border-white/5 group-hover:border-blue-500/20 shadow-inner">
                                        <i data-lucide="${cat.icon}" class="w-5 h-5"></i>
                                    </div>
                                    <div class="flex-1 flex items-center justify-between gap-2 min-w-0 pr-4">
                                        <div class="font-medium text-slate-200 group-hover:text-white transition-colors truncate">${cat.label}</div>
                                        <div class="flex items-center gap-1 flex-shrink-0">
                                            <button onclick="window.app.toggleExpandedChecklist('${cat.key}')" class="p-1 rounded-md transition-colors ${isExpandedChecklist ? 'bg-blue-500/20 text-blue-300' : 'text-slate-500 hover:text-blue-300 hover:bg-white/5'}">
                                                <i data-lucide="list-todo" class="w-3.5 h-3.5"></i>
                                            </button>
                                            <button onclick="window.app.toggleExpandedHistory('${cat.key}')" class="p-1 rounded-md transition-colors ${isExpandedHistory ? 'bg-purple-500/20 text-purple-300' : 'text-slate-500 hover:text-purple-300 hover:bg-white/5'}">
                                                <i data-lucide="bar-chart-3" class="w-3.5 h-3.5"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div class="flex flex-col items-end gap-1.5 order-2 md:order-3 ml-auto md:ml-0 flex-shrink-0 md:w-48">
                                    ${state.isEditingTargets 
                                        ? `<div class="flex items-center gap-2 justify-end w-full">
                                            <span class="text-[10px] uppercase tracking-wider text-slate-500 font-bold">Target</span>
                                            <input type="text" inputmode="numeric" value="${cat.target}" onchange="window.app.handleTargetChange('${cat.key}', this.value)" class="w-20 text-right text-xs font-bold text-blue-300 bg-blue-900/20 border border-blue-500/30 rounded px-2 py-1 focus:outline-none focus:border-blue-400 transition-all" />
                                           </div>`
                                        : `<span class="text-[10px] uppercase tracking-wider text-slate-500 font-bold group-hover:text-slate-400 transition-colors">Target: ${formatMoney(cat.target)}</span>`
                                    }

                                    <div class="flex items-center justify-end gap-2 w-full">
                                        ${cat.fixed && !state.isEditingTargets && (!cat.subCategories || cat.subCategories.length === 0) 
                                            ? `<button onclick="window.app.handleQuickFill('${cat.key}', ${cat.target})" class="p-1.5 text-blue-400/60 hover:text-blue-400 hover:bg-blue-500/10 rounded-full transition-all active:scale-95 flex-shrink-0" title="Mark as paid"><i data-lucide="check-circle-2" class="w-5 h-5"></i></button>`
                                            : `<div class="w-8 h-8 flex-shrink-0"></div>`
                                        }
                                        <div class="relative w-32 md:w-32 flex-shrink-0">
                                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm font-medium">${getCurrencySymbol(state.currency)}</span>
                                            <input type="text" inputmode="numeric" 
                                                value="${displayActual}"
                                                placeholder="0"
                                                ${cat.hasChecklist ? 'readonly' : `onchange="const val = parseFloat(this.value)||0; const rate = window.app.getRate(); const thb = Math.round(val/rate); window.app.handleMainInput('${cat.key}', thb.toString())"`}
                                                class="w-full pl-8 pr-3 py-2 md:py-1.5 text-right text-base md:text-sm font-semibold rounded-lg border outline-none transition-all bg-black/20 focus:bg-black/40 backdrop-blur-sm shadow-inner ${inputClass} ${cat.hasChecklist ? 'cursor-default opacity-80' : ''}"
                                            />
                                        </div>
                                    </div>
                                </div>

                                <div class="w-full order-3 md:order-2 md:flex-1 md:px-8 relative pt-2">
                                    ${pacingPercent ? `<div class="absolute top-0 bottom-0 w-px bg-white/20 z-10 flex flex-col items-center" style="left: ${pacingPercent}%"><div class="w-1.5 h-1.5 -mt-0.5 rounded-full bg-slate-400 shadow-[0_0_5px_rgba(255,255,255,0.5)]"></div></div>` : ''}
                                    <div class="h-1.5 bg-slate-800/50 rounded-full overflow-hidden w-full shadow-inner border border-white/5 relative">
                                        <div class="h-full rounded-full transition-all duration-700 ease-out ${cat.statusColor}" style="width: ${Math.min(cat.percent, 100)}%"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        ${checklistHtml}
                        ${historyHtml}
                    </div>
                `;
            }).join('');

            return `
                <div class="bg-white/5 backdrop-blur-xl rounded-2xl border border-white/10 shadow-2xl overflow-hidden">
                    <div class="p-4 border-b border-white/5 bg-white/5 flex justify-between items-center">
                        <h3 class="font-semibold text-slate-200 flex items-center gap-2 tracking-wide">
                            <i data-lucide="trending-up" class="w-4 h-4 text-blue-400"></i> Expenses
                        </h3>
                        <div class="flex items-center gap-3">
                            ${pacingPercent ? '<div class="flex items-center gap-1.5"><div class="w-1.5 h-1.5 rounded-full bg-white/50"></div><span class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Today</span></div>' : ''}
                            <span class="text-xs text-slate-500 font-medium uppercase tracking-wider">Spent</span>
                        </div>
                    </div>
                    <div class="divide-y divide-white/5">
                        ${categoriesHtml}
                    </div>
                </div>
            `;
        }

        function renderFooter() {
            return `
                <div class="flex justify-between items-end pt-2">
                    <div class="relative z-10">
                        ${!state.showDataMenu ? `
                            <button onclick="window.app.toggleDataMenu()" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-slate-400 hover:text-white hover:bg-white/5 border border-transparent hover:border-white/10 rounded-lg transition-all active:scale-95 backdrop-blur-sm">
                                <i data-lucide="database" class="w-4 h-4"></i> Data
                            </button>
                        ` : `
                            <div class="flex items-center gap-1 bg-slate-900/90 backdrop-blur-xl p-1.5 rounded-xl border border-white/10 shadow-2xl animate-fade-in">
                                <button onclick="window.app.handleExport()" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-300 hover:text-white hover:bg-white/10 rounded-lg transition-colors">
                                    <i data-lucide="save" class="w-4 h-4"></i> Backup
                                </button>
                                <div class="w-px h-4 bg-white/10 mx-1"></div>
                                <button onclick="window.app.triggerImport()" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-300 hover:text-white hover:bg-white/10 rounded-lg transition-colors">
                                    <i data-lucide="upload" class="w-4 h-4"></i> Restore
                                </button>
                                <button onclick="window.app.toggleDataMenu()" class="ml-1 p-1.5 text-slate-500 hover:text-white rounded-lg transition-colors">
                                    <i data-lucide="chevron-right" class="w-4 h-4 rotate-90"></i>
                                </button>
                            </div>
                        `}
                    </div>

                    ${!state.isEditingTargets ? `
                        <button onclick="window.app.toggleEditingTargets()" class="flex items-center gap-2 px-5 py-2.5 text-sm font-medium text-slate-400 hover:text-white hover:bg-white/5 border border-transparent hover:border-white/10 rounded-xl transition-all active:scale-95 backdrop-blur-sm touch-manipulation">
                            <i data-lucide="pencil" class="w-4 h-4"></i> Edit Targets
                        </button>
                    ` : `
                        <div class="flex items-center gap-2 bg-slate-900/80 backdrop-blur-xl p-1.5 rounded-xl border border-white/10 shadow-xl">
                            <button onclick="window.app.resetTargets()" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg transition-colors active:scale-95 touch-manipulation">
                                <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Reset
                            </button>
                            <div class="w-px h-6 bg-white/10"></div>
                            <button onclick="window.app.toggleEditingTargets()" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-emerald-400 bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/20 rounded-lg transition-all active:scale-95 touch-manipulation">
                                <i data-lucide="check" class="w-4 h-4"></i> Done
                            </button>
                        </div>
                    `}
                </div>
            `;
        }

        // Add helper for inline input calculation
        window.app.getRate = () => state.exchangeRates[state.currency];

        // --- MAIN RENDER LOOP ---

        function render() {
            const data = calculateCurrentMonthData();
            
            const app = document.getElementById('app');
            app.innerHTML = `
                ${renderHeader()}
                ${renderSummary(data)}
                ${renderCategoryList(data)}
                ${renderFooter()}
            `;

            // Initialize Icons
            lucide.createIcons();
        }

        // --- INITIALIZATION ---

        async function init() {
            loadFromStorage();
            
            // Initial Render
            render();

            // Fetch Rates
            const fetchRates = async () => {
                try {
                    const response = await fetch('https://api.exchangerate-api.com/v4/latest/THB');
                    if (response.ok) {
                        const data = await response.json();
                        state.exchangeRates = {
                            THB: 1,
                            USD: data.rates.USD,
                            EUR: data.rates.EUR
                        };
                        state.lastRefreshed = new Date();
                        render();
                    }
                } catch (error) {
                    console.error("Failed to fetch rates, using fallbacks", error);
                }
            };

            await fetchRates();
            setInterval(fetchRates, 15 * 60 * 1000);
        }

        // Start App
        init();

    </script>
</body>
</html>
